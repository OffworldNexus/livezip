# Publish a release to PyPI when a version tag is pushed.
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API token is stored.
# PyPI must have a "pending publisher" (or a published project) configured with:
#
#   PyPI project name : livezip
#   Owner             : OffworldNexus
#   Repository        : livezip
#   Workflow filename : release.yml
#   Environment name  : pypi
#
# The tag must be `v<version>` and match `project.version` in pyproject.toml,
# otherwise the build job fails before anything is published.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}."
            exit 1
          fi
          echo "Releasing livezip ${version}."

      - name: Build sdist and wheel
        run: uv build

      - name: Check the built wheel
        run: uv run --with twine twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/livezip
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "livezip ${GITHUB_REF_NAME}" \
            --generate-notes
