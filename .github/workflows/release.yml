# Publish a release to PyPI when a `v<version>` tag is pushed.
#
# Pure uv: `uv build` produces the sdist and wheel, `uv publish` authenticates
# with PyPI Trusted Publishing (OIDC) and uploads PEP 740 attestations — no API
# token is stored anywhere.
#
# PyPI needs a "pending publisher" (or published project) configured with:
#   project `livezip` · owner `OffworldNexus` · repo `livezip`
#   workflow `release.yml` · environment `pypi`

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/livezip
    permissions:
      id-token: write # OIDC token for Trusted Publishing
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Check the tag matches the version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}."
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "livezip ${GITHUB_REF_NAME}" \
            --generate-notes
