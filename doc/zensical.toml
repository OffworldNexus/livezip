[project]
site_name = "LiveZip"
site_description = "Memory-bound, streamable ZIP64 archives — developer documentation."
site_url = "https://offworldnexus.github.io/livezip/"
repo_url = "https://github.com/OffworldNexus/livezip"
repo_name = "OffworldNexus/livezip"
edit_uri = "edit/develop/doc/docs/"

nav = [
  { "Home" = "index.md" },
  { "Developer" = [
    { "Overview" = "developer/index.md" },
    { "Architecture" = "developer/architecture.md" },
    { "The ZIP format" = "developer/zip-format.md" },
    { "Encoding pipeline" = "developer/encoding-pipeline.md" },
    { "Storage strategies" = "developer/storage.md" },
    { "Byte streams" = "developer/streams.md" },
    { "Streaming from S3" = "developer/s3-integration.md" },
    { "Command line" = "developer/cli.md" },
    { "Testing" = "developer/testing.md" },
    { "Contributing" = "developer/contributing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
